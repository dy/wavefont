<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wavefont playground</title>
<meta name="description" content="Audio, or bars drawn by hand, as a line of Wavefont text, and the code that writes it.">
<meta name="theme-color" content="#ecedf0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23202025'/><path fill='%23fff' d='M3 4h2v8H3zM7 11h2v1H7zM11 7h2v5h-2z'/></svg>">
<link rel="preload" href="../fonts/variable/Wavefont[ROND,YELA,wght].woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..700&display=swap">
<link rel="stylesheet" href="../site/main.css">
<style>
  /* playground: the controls in a column, the bars and their code beside them; the site's tokens throughout */
  .pg { min-height: 100svh; background: var(--bg); color: var(--fg); }
  .pg-top { display: flex; align-items: center; gap: var(--space-lg); padding: var(--space-md) var(--pad-x); }
  .pg-top a { color: var(--dim); text-decoration: none; }
  .pg-top a:hover { color: var(--fg); }
  .pg-top .label:first-of-type { margin-right: auto; }
  .pg-home { --wght: 330; --gap: 0.06em; font-size: 1.75rem; line-height: 1.2; color: var(--fg) !important; }

  .pg-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); padding: var(--space-lg) var(--pad-x) var(--space-2xl); }
  .pg-panel { display: grid; gap: var(--space-xl); align-content: start; }
  fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: var(--space-sm); min-width: 0; }
  legend { padding: 0; margin-bottom: var(--space-sm); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
  .btn input[type="file"] { display: none; }
  label.btn { cursor: pointer; }
  .hint { margin: 0; font: var(--label); color: var(--dim); }
  .pg-rec .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--red); }
  .pg-rec.is-on { border-color: var(--red); }
  .pg-draw[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* radios drawn as chips */
  .chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
  .chips label { position: relative; }
  .chips input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .chips span { display: inline-flex; align-items: center; min-height: 2.25rem; padding: 0 var(--space-md); border: 1px solid var(--faint); border-radius: var(--radius-pill); font: var(--label); color: var(--fg); white-space: nowrap; transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
  .chips input:checked + span { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .chips input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chips input:disabled + span { opacity: 0.4; }

  .ctl { display: grid; grid-template-columns: 7rem minmax(0, 1fr) 6ch; align-items: center; gap: 0 var(--space-sm); }
  .ctl > span { font: var(--label); color: var(--dim); }
  .ctl output { font: var(--label); font-variant-numeric: tabular-nums; text-align: right; }
  .off { opacity: 0.4; }
  .check { display: flex; align-items: center; gap: var(--space-xs); font: var(--label); color: var(--dim); cursor: pointer; }
  .check input { width: 1.1rem; height: 1.1rem; accent-color: var(--blue); }
  .is-drawing .for-audio { opacity: 0.4; pointer-events: none; }

  .pg-stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-lg); align-content: start; min-width: 0; }
  .pg-transport { display: flex; align-items: center; gap: var(--space-md); }
  .pg-play { display: grid; place-items: center; width: 3rem; height: 3rem; flex: none; border: 0; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 1.1rem; cursor: pointer; }
  .pg-name { display: grid; min-width: 0; flex: 1; }
  .pg-name b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg-name span, .pg-time { font: var(--label); color: var(--dim); }
  .pg-time { font-variant-numeric: tabular-nums; white-space: nowrap; }

  .pg-preview { --gap: 0.08em; min-height: 40svh; max-height: 64svh; overflow: auto; padding: var(--space-lg); border-radius: var(--radius-md); background: var(--white); color: var(--unplayed); word-break: break-all; cursor: text; }
  .pg-preview.live { display: flex; justify-content: flex-end; overflow: hidden; color: var(--played); }
  .pg-preview.live > span { flex: none; white-space: pre; }
  .pg-drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
  /* the pencil's pad: one line of bars standing on its floor; drag across it to set their heights */
  .pg-pad { --yela: -100; font-size: min(40svh, 22rem); line-height: 1; height: min(40svh, 22rem); white-space: pre; overflow: hidden; background: var(--white) repeating-linear-gradient(to top, var(--faint) 0 1px, transparent 1px 25%); border-radius: var(--radius-md); color: var(--dark); cursor: crosshair; touch-action: none; }
  .pg-status { margin: 0; min-height: 1.4em; font: var(--label); color: var(--dim); }

  .pg-out { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-sm); }
  .pg-out .bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
  .pg-tabs { display: flex; gap: var(--space-md); }
  .pg-tabs button { padding: var(--space-xs) 0; border: 0; border-bottom: 1px solid transparent; background: none; font: var(--label); color: var(--dim); cursor: pointer; }
  .pg-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
  .pg-out pre { max-height: 18rem; overflow: auto; padding: var(--space-md); border-radius: var(--radius-md); background: var(--white); }

  @media (min-width: 60rem) {
    .pg-main { grid-template-columns: 22rem minmax(0, 1fr); column-gap: var(--space-2xl); }
    .pg-panel { position: sticky; top: var(--space-lg); align-self: start; }
  }
</style>

<body class="gray pg">

<header class="pg-top">
  <a class="pg-home wf" href="../" aria-label="Wavefont">wavefont</a>
  <span class="label">playground</span>
  <a class="label" href="https://github.com/dy/wavefont">github</a>
</header>

<main class="pg-main">
  <aside class="pg-panel" aria-label="Settings">
    <fieldset>
      <legend class="label">source</legend>
      <div class="row">
        <label class="btn"><input type="file" accept="audio/*,video/*" name="file">Open file</label>
        <button class="btn pg-rec" type="button"><span class="dot" aria-hidden="true"></span><span class="rec-label">Record</span></button>
        <button class="btn pg-draw" type="button" aria-pressed="false"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.2 2.2a1.6 1.6 0 0 1 2.3 0l.3.3a1.6 1.6 0 0 1 0 2.3L5.6 13H3v-2.6z"/></svg>Draw</button>
      </div>
      <div class="chips" role="radiogroup" aria-label="Samples">
        <label><input type="radio" name="sample" value="voice" checked><span>voice</span></label>
        <label><input type="radio" name="sample" value="song"><span>song</span></label>
        <label><input type="radio" name="sample" value="sine"><span>sine</span></label>
        <label><input type="radio" name="sample" value="saw"><span>saw</span></label>
        <label><input type="radio" name="sample" value="square"><span>square</span></label>
        <label><input type="radio" name="sample" value="noise"><span>noise</span></label>
      </div>
      <p class="hint">Or drop an audio file anywhere. Nothing leaves your browser.</p>
    </fieldset>

    <fieldset class="for-audio">
      <legend class="label">bars</legend>
      <div class="chips" role="radiogroup" aria-label="Drawing">
        <label><input type="radio" name="mode" value="loudness" checked><span>loudness</span></label>
        <label><input type="radio" name="mode" value="minmax"><span>min–max</span></label>
      </div>
      <label class="ctl"><span>per second</span><input type="range" name="rate" min="1" max="100" value="20"><output></output></label>
      <label class="ctl loud"><span>range</span><input type="range" name="range" min="12" max="72" value="42"><output></output></label>
      <label class="check loud"><input type="checkbox" name="pauses" checked> pauses as spaces</label>
    </fieldset>

    <fieldset>
      <legend class="label">axes</legend>
      <label class="ctl"><span title="wght">weight</span><input type="range" name="wght" min="4" max="1000" value="160"><output></output></label>
      <label class="ctl"><span title="ROND">roundness</span><input type="range" name="rond" min="0" max="100" value="0"><output></output></label>
      <label class="ctl loud"><span title="YELA">alignment</span><input type="range" name="yela" min="-100" max="100" value="0"><output></output></label>
      <label class="ctl"><span>size</span><input type="range" name="size" min="12" max="160" value="56"><output></output></label>
      <label class="ctl"><span>spacing</span><input type="range" name="gap" min="0" max="0.5" step="0.005" value="0.08"><output></output></label>
    </fieldset>
  </aside>

  <section class="pg-stage" aria-label="Result">
    <div class="pg-transport">
      <button class="pg-play" type="button" aria-label="Play">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path class="i-play" d="M4 2.5v11l9.5-5.5z"/><path class="i-pause" d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
      </button>
      <div class="pg-name"><b class="pg-title">voice</b><span class="pg-info"></span></div>
      <span class="pg-time"><span class="t-now">0:00</span> / <span class="t-all">0:00</span></span>
    </div>
    <div class="pg-preview wf" role="img" aria-label="Waveform: click a bar to play from it, select bars to play them"><span></span></div>
    <div class="pg-pad wf" role="img" aria-label="Drawing pad: drag across it to set the bars" hidden></div>
    <p class="pg-status" role="status"></p>
    <div class="pg-out">
      <div class="bar">
        <div class="pg-tabs" role="tablist" aria-label="Output">
          <button type="button" role="tab" data-tab="js" aria-selected="true">js</button>
          <button type="button" role="tab" data-tab="html" aria-selected="false">html</button>
          <button type="button" role="tab" data-tab="text" aria-selected="false">text</button>
        </div>
        <button class="btn pg-copy" type="button">Copy</button>
      </div>
      <pre class="code"><code class="pg-code"></code></pre>
    </div>
  </section>
</main>

<script type="module">
  import { playground } from '../site/playground.js'
  playground()
</script>
</body>
</html>
