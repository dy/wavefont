<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wavefont playground</title>
<meta name="description" content="Turn an audio file or your voice into a line of Wavefont text, then copy it as text, HTML or JavaScript.">
<meta name="theme-color" content="#ecedf0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23202025'/><path fill='%23fff' d='M3 4h2v8H3zM7 11h2v1H7zM11 7h2v5h-2z'/></svg>">
<link rel="preload" href="../fonts/variable/Wavefont[ROND,YELA,wght].woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..700&display=swap">
<link rel="stylesheet" href="../site/main.css">
<style>
  /* playground: panel of controls beside a stage with the waveform and its code */
  .pg { min-height: 100svh; background: var(--bg); color: var(--fg); }
  .pg-top {
    display: flex; align-items: center; gap: var(--space-lg);
    padding: var(--space-md) var(--pad-x);
    border-bottom: 1px solid var(--faint);
  }
  .pg-top a { color: var(--dim); text-decoration: none; padding: var(--space-xs) 0; }
  .pg-top a:hover { color: var(--fg); }
  .pg-top h1 { margin-right: auto; }
  .pg-top .pg-home { --wght: 330; --gap: 0.06em; font-size: 1.5rem; line-height: 1.2; color: var(--fg); }

  .pg-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); padding: var(--space-xl) var(--pad-x) var(--space-3xl); }
  .pg-panel { display: grid; gap: var(--space-xl); align-content: start; }
  fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: var(--space-sm); min-width: 0; }
  legend { padding: 0; margin-bottom: var(--space-sm); color: var(--dim); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
  .btn input[type="file"] { display: none; }
  label.btn { cursor: pointer; }
  .hint { margin: 0; color: var(--dim); font-size: var(--text-small); }

  /* radios drawn as chips */
  .chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); border: 0; padding: 0; margin: 0; }
  .chips label { position: relative; }
  .chips input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .chips span {
    display: inline-flex; align-items: center; min-height: 2.25rem; padding: 0 var(--space-md);
    border: 1px solid var(--faint); border-radius: var(--radius-pill);
    font-size: var(--text-small); white-space: nowrap;
    transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);
  }
  .chips input:checked + span { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .chips input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
  .chips input:disabled + span { opacity: 0.4; }

  .ctl { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 var(--space-md); font-size: var(--text-small); }
  .ctl > span { grid-column: 1 / -1; color: var(--dim); }
  .ctl output { font: 500 var(--text-small)/1 var(--font-mono); font-variant-numeric: tabular-nums; min-width: 8ch; text-align: right; }
  .ctl.off { opacity: 0.4; }
  .check { display: flex; align-items: center; gap: var(--space-xs); font-size: var(--text-small); cursor: pointer; }
  .check input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }

  .pg-stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-lg); align-content: start; min-width: 0; }
  .pg-transport { display: flex; align-items: center; gap: var(--space-md); }
  .pg-transport .play-big { width: 3rem; height: 3rem; }
  .pg-name { display: grid; min-width: 0; flex: 1; }
  .pg-name b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg-name span { color: var(--dim); font-size: var(--text-small); }
  .pg-transport .time { font: 500 var(--text-small)/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap; }

  .pg-preview {
    --gap: 0.1em;
    min-height: 40svh;
    max-height: 70svh;
    overflow: auto;
    padding: var(--space-lg);
    border-radius: var(--radius-md);
    background: var(--bg);
    box-shadow: inset 0 0 0 1px var(--faint);
    color: var(--unplayed);
    word-break: break-all;
    cursor: text;
    outline-offset: 2px;
  }
  .pg-preview.live { display: flex; justify-content: flex-end; overflow: hidden; color: var(--played); }
  .pg-preview.live > span { flex: none; white-space: pre; }
  .pg-drop { outline: 2px dashed var(--accent); outline-offset: -8px; }

  .pg-out { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-sm); }
  .pg-out .bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; }
  .pg-out pre { max-height: 16rem; overflow: auto; font-size: 0.8125rem; }
  .pg-status { margin: 0; min-height: 1.5em; color: var(--dim); font-size: var(--text-small); }

  .swatches span::before { content: ""; display: inline-block; width: 0.75rem; height: 0.75rem; margin-right: 0.4rem; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 1px var(--faint); }

  @media (min-width: 60rem) {
    .pg-main { grid-template-columns: 20rem minmax(0, 1fr); column-gap: var(--space-3xl); }
    .pg-panel { position: sticky; top: var(--space-xl); align-self: start; }
  }
</style>

<body class="pale pg">

<header class="pg-top">
  <a class="pg-home wf" href="../" aria-label="Wavefont home">wavefont</a>
  <h1 class="label">playground</h1>
  <a class="label" href="https://github.com/dy/wavefont">github</a>
</header>

<main class="pg-main">
  <aside class="pg-panel" aria-label="Settings">
    <fieldset>
      <legend class="label">source</legend>
      <div class="row">
        <label class="btn ghost"><input type="file" accept="audio/*,video/*" name="file">Open file</label>
        <button class="btn ghost rec" type="button"><span class="dot" aria-hidden="true"></span><span class="rec-label">Record</span></button>
      </div>
      <div class="chips" role="radiogroup" aria-label="Samples">
        <label><input type="radio" name="sample" value="voice" checked><span>voice</span></label>
        <label><input type="radio" name="sample" value="song"><span>song</span></label>
        <label><input type="radio" name="sample" value="sine"><span>sine</span></label>
        <label><input type="radio" name="sample" value="saw"><span>saw</span></label>
        <label><input type="radio" name="sample" value="square"><span>square</span></label>
        <label><input type="radio" name="sample" value="noise"><span>noise</span></label>
      </div>
      <p class="hint">Or drop an audio file anywhere on the page. Nothing leaves your browser.</p>
    </fieldset>

    <fieldset>
      <legend class="label">bars</legend>
      <div class="chips" role="radiogroup" aria-label="Drawing">
        <label><input type="radio" name="mode" value="loudness" checked><span>loudness</span></label>
        <label><input type="radio" name="mode" value="minmax"><span>min–max</span></label>
      </div>
      <label class="ctl"><span>bars per second</span><input type="range" name="rate" min="1" max="100" value="20"><output></output></label>
      <label class="ctl loud"><span>dynamic range</span><input type="range" name="range" min="12" max="72" value="42"><output></output></label>
      <label class="check loud"><input type="checkbox" name="pauses" checked> Pauses as spaces</label>
    </fieldset>

    <fieldset>
      <legend class="label">style</legend>
      <label class="ctl"><span>weight</span><input type="range" name="wght" min="4" max="1000" value="120"><output></output></label>
      <label class="ctl"><span>roundness</span><input type="range" name="rond" min="0" max="100" value="0"><output></output></label>
      <label class="ctl loud"><span>alignment</span><input type="range" name="yela" min="-100" max="100" value="0"><output></output></label>
      <label class="ctl"><span>size</span><input type="range" name="size" min="12" max="160" value="56"><output></output></label>
      <label class="ctl"><span>spacing</span><input type="range" name="gap" min="0" max="0.5" step="0.005" value="0.08"><output></output></label>
      <label class="ctl"><span>line height</span><input type="range" name="lh" min="1" max="2" step="0.05" value="1.25"><output></output></label>
      <div class="chips swatches" role="radiogroup" aria-label="Colors">
        <label><input type="radio" name="theme" value="pale" checked><span style="--sw: var(--color-pale)">pale</span></label>
        <label><input type="radio" name="theme" value="dark"><span style="--sw: var(--color-charcoal)">charcoal</span></label>
        <label><input type="radio" name="theme" value="blue"><span style="--sw: var(--color-periwinkle)">periwinkle</span></label>
      </div>
    </fieldset>
  </aside>

  <section class="pg-stage" aria-label="Result">
    <div class="pg-transport">
      <button class="play-big" type="button" aria-label="Play">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path class="i-play" d="M4 2.5v11l9.5-5.5z"/><path class="i-pause" d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
      </button>
      <div class="pg-name"><b class="name">voice</b><span class="info"></span></div>
      <span class="time"><span class="t-now">0:00</span> / <span class="t-all">0:00</span></span>
    </div>

    <div class="pg-preview wf pale" role="img" aria-label="Waveform: click a bar to play from it, select bars to play them"><span></span></div>
    <p class="pg-status" role="status"></p>

    <div class="pg-out">
      <div class="bar">
        <div class="chips" role="radiogroup" aria-label="Output">
          <label><input type="radio" name="out" value="text" checked><span>text</span></label>
          <label><input type="radio" name="out" value="html"><span>html</span></label>
          <label><input type="radio" name="out" value="js"><span>js</span></label>
        </div>
        <button class="btn copy" type="button">Copy</button>
      </div>
      <pre class="code"><code class="out"></code></pre>
    </div>
  </section>
</main>

<script type="module">
  import wf, { bars } from '../index.js'
  import { levels, speech, decode, buffer, voice, song, playing } from '../site/sound.js'
  import { clock, copy, track, listen, micError } from '../site/wave.js'

  const $ = s => document.querySelector(s)
  const form = { get: name => document.querySelector(`[name="${name}"]:is(:checked, :not([type=radio]))`) }
  const val = name => { const i = document.querySelector(`[name="${name}"]`); return i.type === 'checkbox' ? i.checked : i.type === 'radio' ? form.get(name).value : +i.value }
  const preview = $('.pg-preview'), text = preview.firstElementChild
  const status = $('.pg-status'), out = $('.out'), rec = $('.rec'), recLabel = $('.rec-label')
  const CDN = 'https://cdn.jsdelivr.net/npm/wavefont@3/fonts/variable/Wavefont[ROND,YELA,wght].woff2'

  let source = null, name = '', recorder = null

  const tr = track(text, {
    ontime: t => $('.t-now').textContent = clock(t),
    onstate: on => $('.play-big').classList.toggle('is-playing', on)
  })

  // ── samples: the site's voice and song, and tones whose loudness follows a shape ──
  const SR = 22050
  const tone = (seconds, env, noisy) => {
    const d = new Float32Array(seconds * SR)
    for (let i = 0; i < d.length; i++) {
      const t = i / SR, x = noisy ? Math.random() * 2 - 1 : Math.sin(2 * Math.PI * 220 * t) + 0.3 * Math.sin(2 * Math.PI * 440 * t)
      d[i] = 0.6 * env(t) * x
    }
    return buffer(d, SR)
  }
  const SAMPLES = {
    voice: () => voice(11, 9, 150),
    song: () => song(),
    sine: () => tone(4, t => 0.5 + 0.5 * Math.sin(2 * Math.PI * 1.25 * t)),
    saw: () => tone(4, t => (t * 1.25) % 1),
    square: () => tone(4, t => (t * 1.25) % 1 < 0.5 ? 1 : 0.02),
    noise: () => tone(4, t => 0.3 + 0.7 * Math.abs(Math.sin(2 * Math.PI * 0.9 * t) * Math.sin(2 * Math.PI * 0.23 * t)), true)
  }

  // ── audio → text ──
  const drawn = () => {
    const d = source.getChannelData(0), n = Math.max(4, Math.min(20000, Math.round(source.duration * val('rate'))))
    const dt = source.duration / n
    if (val('mode') === 'minmax') {
      let peak = 0
      for (const x of d) peak = Math.max(peak, Math.abs(x))
      const lo = new Float32Array(n), hi = new Float32Array(n)
      for (let i = 0; i < n; i++) {
        let a = 0, b = 0
        for (let j = Math.floor(i * d.length / n), e = Math.floor((i + 1) * d.length / n); j < e; j++) a = Math.min(a, d[j]), b = Math.max(b, d[j])
        lo[i] = 64 * (a / (peak || 1) + 1), hi[i] = 64 * (b / (peak || 1) + 1)
      }
      return { lo, hi, take: { buf: source, text: bars(lo, hi), at: Array.from({ length: n + 1 }, (_, i) => i * dt) } }
    }
    const lv = levels(d, n, val('range'))
    if (val('pauses')) return { lv, take: { buf: source, ...speech(lv, dt, false, 0.14, Math.max(2, Math.round(0.25 / dt))) } }
    return { lv, take: { buf: source, text: wf(Array.from(lv, v => v * 100)), at: Array.from({ length: n + 1 }, (_, i) => i * dt) } }
  }

  let result
  const analyse = () => {
    if (!source) return
    result = drawn()
    tr.set(result.take)
    $('.t-all').textContent = clock(source.duration)
    const count = [...result.take.text].filter(c => c !== ' ').length
    $('.info').textContent = `${clock(source.duration)}, ${count.toLocaleString('en')} bars`
    code()
  }

  // ── style ──
  const style = () => {
    const s = preview.style
    s.setProperty('--wght', val('wght')), s.setProperty('--rond', val('rond')), s.setProperty('--yela', val('yela'))
    s.setProperty('--gap', val('gap') + 'em'), s.fontSize = val('size') + 'px', s.lineHeight = val('lh')
    preview.classList.remove('pale', 'dark', 'blue'), preview.classList.add(val('theme'))
    code()
  }
  const outputs = () => {
    const f = (n, d = 0) => (+n).toFixed(d)
    const labels = {
      rate: v => `${v}/s`, range: v => `${v} dB`, wght: v => v, rond: v => v, yela: v => v,
      size: v => `${v}px`, gap: v => `${f(v, 3)}em`, lh: v => f(v, 2)
    }
    for (const [k, fmt] of Object.entries(labels)) document.querySelector(`[name="${k}"]`).nextElementSibling.textContent = fmt(val(k))
    const loud = val('mode') === 'loudness'
    document.querySelectorAll('.loud').forEach(e => e.classList.toggle('off', !loud))
    document.querySelectorAll('.loud input').forEach(i => i.disabled = !loud)
  }

  // ── code ──
  const code = () => {
    if (!result) return
    const minmax = val('mode') === 'minmax', t = result.take.text
    const axes = `'wght' ${val('wght')}, 'ROND' ${val('rond')}` + (minmax ? '' : `, 'YELA' ${val('yela')}`)
    const css = `font: ${val('size')}px/${val('lh')} wavefont; font-variation-settings: ${axes}; letter-spacing: ${val('gap')}em`
    const ints = a => '[' + Array.from(a, v => Math.round(v)).join(', ') + ']'
    const kind = val('out')
    out.textContent =
      kind === 'text' ? t :
      kind === 'html' ? `<style>\n@font-face { font-family: wavefont; font-display: block; src: url(${CDN}) format('woff2'); }\n</style>\n<span style="${css}">${t}</span>` :
      minmax ? `import { bars } from 'wavefont'\n\n// one bar per slice, from its lowest level to its highest (0–127, 64 is the middle)\nel.textContent = bars(\n  ${ints(result.lo)},\n  ${ints(result.hi)}\n)` :
      `import wf from 'wavefont'\n\n// loudness per slice, 0–100\nel.textContent = wf(${ints(Array.from(result.lv, v => v * 100))})`
  }

  // ── sources ──
  const use = (buf, label) => {
    source = buf, name = label
    $('.name').textContent = label
    status.textContent = ''
    analyse()
  }
  const sample = () => use(SAMPLES[val('sample')](), val('sample'))
  const open = async file => {
    if (!file) return
    status.textContent = `Decoding ${file.name}…`
    try { use(await decode(file), file.name) }
    catch { status.textContent = `${file.name} could not be decoded. Try an mp3, wav, ogg or m4a file.` }
  }

  document.querySelector('[name="file"]').addEventListener('change', e => open(e.target.files[0]))
  document.querySelectorAll('[name="sample"]').forEach(i => i.addEventListener('change', sample))
  addEventListener('dragover', e => { e.preventDefault(), preview.classList.add('pg-drop') })
  addEventListener('dragleave', e => e.relatedTarget || preview.classList.remove('pg-drop'))
  addEventListener('drop', e => { e.preventDefault(), preview.classList.remove('pg-drop'), open(e.dataTransfer.files[0]) })

  rec.addEventListener('click', async () => {
    if (recorder) {
      const buf = recorder.stop()
      recorder = null
      preview.classList.remove('live'), rec.classList.remove('is-on'), recLabel.textContent = 'Record'
      document.querySelectorAll('[name="sample"]').forEach(i => i.checked = false)
      return buf.duration > 0.2 ? use(buf, 'recording') : (status.textContent = 'Nothing came through. Check the microphone input and try again.', analyse())
    }
    playing()?.stop()
    try {
      recorder = await listen((lv, s) => { text.textContent = speech(lv, 0.05, true).text, $('.t-now').textContent = clock(s) })
      preview.classList.add('live'), text.textContent = ''
      rec.classList.add('is-on'), recLabel.textContent = 'Stop'
    } catch (e) { status.textContent = micError(e) }
  })

  $('.play-big').addEventListener('click', () => tr.take && tr.toggle())
  $('.copy').addEventListener('click', e => copy(e.currentTarget, out.textContent))

  for (const i of document.querySelectorAll('.pg-panel input:not([type=file]):not([name=sample]), [name=out]')) {
    i.addEventListener('input', () => {
      outputs()
      if (['rate', 'range', 'pauses', 'mode'].includes(i.name)) analyse()
      else if (i.name === 'out') code()
      else style()
    })
  }

  // ?src=https://… loads audio from a link (the server must allow cross-origin reads)
  const src = new URLSearchParams(location.search).get('src')
  outputs(), style()
  if (src) {
    status.textContent = 'Loading audio…'
    fetch(src).then(r => r.blob()).then(b => open(new File([b], decodeURIComponent(src.split('/').pop()) || 'audio')))
      .catch(() => { status.textContent = 'That link could not be loaded here. Download the file and open it instead.', sample() })
  } else sample()
</script>
</body>
</html>
